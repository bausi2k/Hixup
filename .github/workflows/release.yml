name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Tests
        run: swift test
      - name: DMG bauen
        run: scripts/build-release.sh
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.dmg \
            --title "${{ github.ref_name }}" --generate-notes \
            --notes "Unsigniertes Build. Signierte und notarisierte Releases folgen mit dem Developer-ID-Zertifikat."
